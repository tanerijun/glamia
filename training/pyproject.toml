[project]
name = "glamia-training"
version = "1.0.0"
description = "GLAMIA 3D gaze backbone training (Gaze360, MPIIFaceGaze)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pyyaml>=6.0.2",
    "scipy>=1.16.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
