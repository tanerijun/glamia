[project]
name = "glamia-inference"
version = "1.0.0"
description = "GLAMIA inference pipeline, webcam demo, and public-benchmark evaluation"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11.0",
    "mediapipe>=0.10.14",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
